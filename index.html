
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hifz Master - Quran Memorization App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script>
      // Set the theme and the Arabic font before the first paint - otherwise the light version
      // flashes up briefly on load, which is exactly what you do not want in a dark room, and
      // the verses would reflow once as the chosen font takes over from the default.
      (function () {
        try {
          var t = localStorage.getItem('hifz_theme');
          if (t === 'dark' || ((!t || t === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.dataset.arabicFont =
            localStorage.getItem('hifz_arabic_font') || 'scheherazade';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Amiri+Quran&family=Inter:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Lets native bits - scrollbar corner, focus rings, form controls - follow along. */
      .dark {
        color-scheme: dark;
      }
      .font-quran {
        font-family: 'Amiri', serif;
      }

      /* --- The Arabic font of the verses -------------------------------------------------
         Everything about the selectable fonts lives here, so App.tsx only ever deals in ids.
         The id sits on <html data-arabic-font> - same mechanism as the dark class, and the
         same reason: switching it repaints without re-rendering 286 memoized verse rows.

         All four render the Uthmani rasm of the bundled Tanzil text correctly. The KFGQPC
         Madinah Mushaf font does not, and is deliberately absent - see todo.md.

         Each font brings its own size and leading. At the same pixel size Arabic faces differ
         far more than Latin ones: Scheherazade sets a tall alef, Noto Naskh a much shorter one
         over a similar horizontal run, and Amiri parks its marks nearly a full em above the
         baseline. Both numbers were measured rather than guessed - canvas ink extents of a
         bare word and of the basmala, at 100px, per family - and then trimmed by eye.

         scale brings the letters to the size Scheherazade sets at 1, weighing letter height
         against horizontal set so that a line still breaks in roughly the same place.
         leading keeps the room above the line in the same proportion to the marks that
         Scheherazade has at 2.5rem, which is what the app looked like before any of this.

         Each font is declared once, for two selectors: on <html> it dresses the whole app, and
         on a [data-font-sample] element it dresses just that one specimen in the settings
         panel. Custom properties set on an element are readable by that same element, so the
         previews come out normalized exactly like the real text - without the numbers below
         having to exist twice. */
      :root,
      [data-font-sample='scheherazade'] {
        --font-arabic: 'Scheherazade New', serif;
        --font-arabic-scale: 1;
        --font-arabic-leading: 1;
      }
      :root[data-arabic-font='amiri-quran'],
      [data-font-sample='amiri-quran'] {
        --font-arabic: 'Amiri Quran', serif;
        --font-arabic-scale: 1.15;
        --font-arabic-leading: 1.35;
      }
      :root[data-arabic-font='amiri'],
      [data-font-sample='amiri'] {
        --font-arabic: 'Amiri', serif;
        --font-arabic-scale: 1.12;
        --font-arabic-leading: 1.3;
      }
      :root[data-arabic-font='noto-naskh'],
      [data-font-sample='noto-naskh'] {
        /* Noto sets a short alef over a wide run, so matching it on letter height alone would
           blow the line width out and rewrap half the verses. 1.05 keeps the breaks where the
           other three put them. */
        --font-arabic: 'Noto Naskh Arabic', serif;
        --font-arabic-scale: 1.05;
        --font-arabic-leading: 1.05;
      }

      /* Size belongs here rather than in a Tailwind class on the element: .text-3xl and
         .font-arabic-display have the same specificity, and Tailwind arrives from a CDN
         script, so which one won would come down to style injection order. */
      .font-arabic-display {
        font-family: var(--font-arabic);
        font-size: calc(1.875rem * var(--font-arabic-scale));
        line-height: calc(2.5rem * var(--font-arabic-leading));
      }
      .font-arabic-display.font-arabic-lg {
        font-size: calc(2.25rem * var(--font-arabic-scale));
      }

      /* One specimen in the settings panel. Reads the variables its own [data-font-sample]
         attribute just set, so it is scaled the way the verses will be. */
      .font-arabic-sample {
        font-family: var(--font-arabic);
        font-size: calc(1.125rem * var(--font-arabic-scale));
        line-height: calc(2rem * var(--font-arabic-leading));
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.574.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 overflow-x-hidden">

  <script type="module" src="/index.tsx"></script>
</body>
</html>
