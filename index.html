
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hifz Master - Quran Memorization App</title>
    <script>
      // Set the theme and the Arabic font before the first paint - otherwise the light version
      // flashes up briefly on load, which is exactly what you do not want in a dark room, and
      // the verses would reflow once as the chosen font takes over from the default.
      (function () {
        try {
          var t = localStorage.getItem('hifz_theme');
          if (t === 'dark' || ((!t || t === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.dataset.arabicFont =
            localStorage.getItem('hifz_arabic_font') || 'scheherazade';
        } catch (e) {}
      })();
    </script>
    <!-- The five faces the interface and the verses are set in, mirrored from Google Fonts by
         `npm run fetch:fonts` into public/fonts/. Linked here rather than imported from
         index.css so it is in the head from the start: the @font-face set has to be known
         before the first paint, which is what the script above exists to arrange. -->
    <link rel="stylesheet" href="/fonts/google.css">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
